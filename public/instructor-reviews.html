<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work Reviews — GitStack</title>
  <link rel="icon" type="image/svg+xml" href="gitstack-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="instructor-dashboard.css">
  <link rel="stylesheet" href="dashboard-v15.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="work-reviews.css">
</head>
<body class="instructor-app" data-instructor-page="reviews">
  <div class="instructor-shell">
    <aside class="instructor-sidebar">
      <a class="instructor-brand" href="instructor-dashboard.html"><span class="instructor-brand-mark"><i data-lucide="git-branch"></i></span><span>Git<span>Stack</span></span></a>
      <nav class="instructor-nav" aria-label="Instructor navigation"><a data-page="dashboard" href="instructor-dashboard.html"><i data-lucide="layout-dashboard"></i>Dashboard</a>
<a data-page="students" href="instructor-students.html"><i data-lucide="users"></i>Students</a>
<a data-page="missions" href="instructor-missions.html"><i data-lucide="map"></i>Missions</a>
<a data-page="assignments" href="instructor-assignments.html"><i data-lucide="clipboard-list"></i>Assignments</a>
<a data-page="teams" href="instructor-teams.html"><i data-lucide="users-round"></i>Teams</a>
<a data-page="gitea" href="instructor-gitea.html"><i data-lucide="git-pull-request"></i>Gitea</a>
<a data-page="assessments" href="instructor-assessments.html"><i data-lucide="scan-search"></i>Assessments</a>
<a data-page="analytics" href="instructor-analytics.html"><i data-lucide="chart-no-axes-combined"></i>Analytics</a>
<a data-page="activity" href="instructor-activity.html"><i data-lucide="activity"></i>Activity</a>
<a data-page="profile" href="instructor-profile.html"><i data-lucide="user-round"></i>Profile</a></nav>
      <div class="instructor-sidebar-spacer"></div>
      <div class="instructor-mini-profile"><strong data-no-translate data-instructor-name>Instructor</strong><span data-no-translate data-instructor-designation>Instructor</span><div class="instructor-sidebar-actions"><button type="button" data-logout>Logout</button></div></div>
    </aside>
    <main class="instructor-main">
      <header class="instructor-topbar"><div class="instructor-page-title"><button class="mobile-menu" type="button" data-mobile-menu aria-label="Open navigation"><i data-lucide="menu"></i></button><div><h1>Work Reviews</h1><p>Individual contributions and instructor feedback.</p></div></div><div class="instructor-top-actions"><div class="dashboard-language-switch" aria-label="Language selector">
            <button type="button" data-lang="en" aria-label="English">EN</button>
            <button type="button" data-lang="bn" aria-label="বাংলা">BN</button>
          </div><span class="gitea-pill"><i data-lucide="git-pull-request"></i>Gitea collaboration</span><span class="role-pill">Instructor</span></div></header>
      <div class="instructor-content">
<section class="work-reviews" data-no-translate>
  <div class="review-page-heading"><div><h2 data-review-label="heading">Work reviews</h2><p data-review-label="description"></p></div><button type="button" class="secondary-action" id="refreshWorkReviews" data-review-label="refresh">Refresh</button></div>
  <p id="reviewPageMessage" class="review-message" role="status" hidden></p>
  
  <div class="review-toolbar"><span class="review-counter" id="reviewCounts"></span><label for="reviewStatusFilter"><span data-review-label="filter">Status</span><select id="reviewStatusFilter"><option value="ALL" data-review-label="all">All requests</option><option value="PENDING" data-review-label="pending">Pending review</option><option value="REVIEWED" data-review-label="reviewed">Reviewed</option><option value="APPROVED" data-review-label="approved">Approved</option><option value="CHANGES_REQUESTED" data-review-label="changes">Changes requested</option></select></label></div>
  <div class="review-layout"><section class="review-list" id="workReviewList" aria-label="Review requests"></section><section class="review-detail" id="workReviewDetail" aria-label="Review details"></section></div>
</section>
</div></main></div>
<script src="theme.js"></script><script src="language.js"></script><script src="instructor-common.js"></script><script src="dashboard-notifications.js"></script><script src="work-reviews.js"></script>
</body></html>
