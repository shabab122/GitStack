<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work Reviews — GitStack</title>

  <link rel="icon" type="image/svg+xml" href="gitstack-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="student-dashboard.css">
  <link rel="stylesheet" href="dashboard-v15.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="git-command-visualizer.css">
  <link rel="stylesheet" href="work-reviews.css">
</head>

<body class="student-app" data-student-page="reviews">
  <div class="student-shell">
    <aside class="student-sidebar">
      <a class="student-brand" href="student-dashboard.html">
        <span class="student-brand-mark">
          <i data-lucide="git-branch"></i>
        </span>
        <span>Git<span>Stack</span></span>
      </a>

      <nav class="student-nav" aria-label="Student navigation">
        <a data-page="dashboard" href="student-dashboard.html">
          <i data-lucide="layout-dashboard"></i>Dashboard
        </a>
        <a data-page="missions" href="student-missions.html">
          <i data-lucide="map"></i>Missions
        </a>
        <a data-page="workspace" href="student-mission.html">
          <i data-lucide="terminal-square"></i>Mission Workspace
        </a>
        <a data-page="progress" href="student-progress.html">
          <i data-lucide="chart-no-axes-combined"></i>Progress & XP
        </a>
        <a data-page="assessment" href="student-assessment.html">
          <i data-lucide="scan-search"></i>Assessment & Feedback
        </a>
        <a data-page="team" href="student-team.html">
          <i data-lucide="users-round"></i>Team Activity
        </a>
        <a data-page="profile" href="student-profile.html">
          <i data-lucide="user-round"></i>Profile
        </a>
      </nav>

      <div class="student-sidebar-spacer"></div>

      <div class="student-mini-profile">
        <strong data-no-translate data-student-name>Student</strong>
        <span data-no-translate data-student-id></span>

        <div class="student-sidebar-actions">
          <button type="button" data-logout>Logout</button>
        </div>
      </div>
    </aside>

    <main class="student-main">
      <header class="student-topbar">
        <div class="student-page-title">
          <button
            class="mobile-menu"
            type="button"
            data-mobile-menu
            aria-label="Open navigation"
          >
            <i data-lucide="menu"></i>
          </button>

          <div>
            <h1>Work Reviews</h1>
            <p>Individual contributions and instructor feedback.</p>
          </div>
        </div>

        <div class="student-top-actions">
          <div class="dashboard-language-switch" aria-label="Language selector">
            <button type="button" data-lang="en" aria-label="English">EN</button>
            <button type="button" data-lang="bn" aria-label="বাংলা">BN</button>
          </div>

          <span class="xp-pill">
            <i data-lucide="sparkles"></i>
            <span data-student-xp>0 XP</span>
          </span>

          <span class="role-pill">Student</span>
        </div>
      </header>

      <div class="student-content">
        <section class="work-reviews" data-no-translate>
          <div class="review-page-heading">
            <div>
              <h2 data-review-label="heading">Work reviews</h2>
              <p data-review-label="description"></p>
            </div>

            <button
              type="button"
              class="secondary-action"
              id="refreshWorkReviews"
              data-review-label="refresh"
            >
              Refresh
            </button>
          </div>

          <p
            id="reviewPageMessage"
            class="review-message"
            role="status"
            hidden
          ></p>

          <details class="review-compose" id="reviewCompose">
            <summary data-review-label="newRequest">Request a review</summary>
            <p class="review-help" data-review-label="scopeHelp"></p>

            <form id="workReviewForm" class="review-form">
              <div class="review-field">
                <label for="reviewTeam" data-review-label="team">
                  Team repository
                </label>
                <select id="reviewTeam" required></select>
              </div>

              <div class="review-field">
                <label for="reviewAssignment" data-review-label="assignment">
                  Assignment (optional)
                </label>
                <select id="reviewAssignment"></select>
              </div>

              <div class="review-field full">
                <label for="reviewTitle" data-review-label="title">
                  Review title
                </label>
                <input
                  id="reviewTitle"
                  required
                  minlength="3"
                  maxlength="120"
                  data-review-placeholder="titlePlaceholder"
                >
              </div>

              <div class="review-field reference-field">
                <label for="reviewReferenceType" data-review-label="referenceType">
                  Work reference
                </label>

                <select id="reviewReferenceType">
                  <option value="BRANCH" data-review-label="branch">
                    Branch
                  </option>
                  <option value="COMMIT" data-review-label="commit">
                    Commit
                  </option>
                  <option value="PULL_REQUEST" data-review-label="pullRequest">
                    Pull Request
                  </option>
                </select>
              </div>

              <div class="review-field reference-field">
                <label for="reviewReference" data-review-label="reference">
                  Branch name, commit SHA or PR number
                </label>
                <input id="reviewReference" required maxlength="180">
              </div>

              <div class="review-field full">
                <label for="reviewSummary" data-review-label="summary">
                  My contribution and questions
                </label>
                <textarea
                  id="reviewSummary"
                  required
                  minlength="10"
                  maxlength="3000"
                  rows="4"
                  data-review-placeholder="summaryPlaceholder"
                ></textarea>
              </div>

              <div class="review-field full">
                <label for="reviewFiles" data-review-label="files">
                  Files to focus on (optional)
                </label>
                <textarea
                  id="reviewFiles"
                  rows="2"
                  data-review-placeholder="filesPlaceholder"
                ></textarea>
                <small class="review-help" data-review-label="filesHelp"></small>
              </div>

              <div class="review-field full">
                <p
                  id="reviewFormMessage"
                  class="review-message"
                  role="status"
                  hidden
                ></p>

                <div class="review-button-row">
                  <button
                    type="submit"
                    id="sendWorkReview"
                    class="primary-action"
                    data-review-label="send"
                  >
                    Send review request
                  </button>
                </div>
              </div>
            </form>
          </details>

          <div class="review-toolbar">
            <span class="review-counter" id="reviewCounts"></span>

            <label for="reviewStatusFilter">
              <span data-review-label="filter">Status</span>

              <select id="reviewStatusFilter">
                <option value="ALL" data-review-label="all">
                  All requests
                </option>
                <option value="PENDING" data-review-label="pending">
                  Pending review
                </option>
                <option value="REVIEWED" data-review-label="reviewed">
                  Reviewed
                </option>
                <option value="APPROVED" data-review-label="approved">
                  Approved
                </option>
                <option value="CHANGES_REQUESTED" data-review-label="changes">
                  Changes requested
                </option>
              </select>
            </label>
          </div>

          <div class="review-layout">
            <section
              class="review-list"
              id="workReviewList"
              aria-label="Review requests"
            ></section>

            <section
              class="review-detail"
              id="workReviewDetail"
              aria-label="Review details"
            ></section>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="theme.js"></script>
  <script src="language.js"></script>
  <script src="student-common.js"></script>
  <script src="dashboard-notifications.js"></script>
  <script src="work-reviews.js"></script>
</body>
</html>
