services:
  postgres:
    image: postgres:17.6-alpine
    container_name: gitstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitstack
      POSTGRES_USER: gitstack
      POSTGRES_PASSWORD: gitstack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - gitstack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitstack -d gitstack"]
      interval: 5s
      timeout: 5s
      retries: 20

  gitea-db:
    image: postgres:17.6-alpine
    container_name: gitstack-gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea_dev_password
    volumes:
      - gitstack_gitea_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 5s
      timeout: 5s
      retries: 20

  gitea:
    image: gitea/gitea:1.24
    container_name: gitstack-gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: gitea_dev_password
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3002/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 2222
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__webhook__ALLOWED_HOST_LIST: "external,private,loopback"
    ports:
      - "3002:3000"
      - "2222:22"
    volumes:
      - gitstack_gitea_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - gitstack_sandbox_network

volumes:
  gitstack_gitea_data:
  gitstack_gitea_postgres_data:
  gitstack_postgres_data:

networks:
  gitstack_sandbox_network:
    name: gitstack-sandbox-network
    driver: bridge
    internal: true
